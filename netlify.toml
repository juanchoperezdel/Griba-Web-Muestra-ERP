# Build de la landing nueva (servida en /).
# La versión anterior (v1) fue eliminada del repo, solo queda esta.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: cualquier ruta no resuelta vuelve al index principal.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
